<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDI Piano</title>
<style>
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#14202b; --muted:#5b6b78; --line:#cfd8de;
  --accent:#0e8f83; --accent-ink:#ffffff; --white-key:#fbfcfc; --black-key:#1b2630; --hit:#19b8a8; --hit-black:#0e8f83;
  --err:#b3261e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171d; --panel:#17222b; --ink:#e8eef2; --muted:#93a4b1; --line:#2b3a46;
    --accent:#2bc4b4; --accent-ink:#06201d; --white-key:#e9eef1; --black-key:#0a1015; --hit:#2bc4b4; --hit-black:#2bc4b4;
    --err:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171d; --panel:#17222b; --ink:#e8eef2; --muted:#93a4b1; --line:#2b3a46;
  --accent:#2bc4b4; --accent-ink:#06201d; --white-key:#e9eef1; --black-key:#0a1015; --hit:#2bc4b4; --hit-black:#2bc4b4;
  --err:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
button,select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.toggle{display:flex;gap:8px;align-items:center;color:var(--muted)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--hit)}
#msg{margin:12px 2px 0;min-height:1.4em;color:var(--muted)}
#msg.err{color:var(--err)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.scroller{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 10px 10px;-webkit-overflow-scrolling:touch}
.keys{position:relative;height:190px;touch-action:pan-x}
.key{position:absolute;top:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.key.w{height:100%;background:var(--white-key);border:1px solid #8a98a3;border-radius:0 0 6px 6px;z-index:1}
.key.b{height:62%;background:var(--black-key);border-radius:0 0 4px 4px;z-index:2}
.key.w.on{background:var(--hit)}
.key.b.on{background:var(--hit-black);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.key .n{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.68rem;color:#5b6b78;pointer-events:none}
.key.on .n{color:#06201d}
h2{font-size:1.05rem;margin:22px 0 8px}
#log{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto}
#log li{display:flex;gap:14px;padding:7px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#log li:last-child{border-bottom:0}
#log .t{color:var(--muted);min-width:4.5em}
#log .empty{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>MIDI Piano</h1>
  <p class="sub">Connect your Bluetooth keyboard and watch each key register as you play.</p>

  <div class="bar">
    <button id="connect" class="primary">Connect keyboard</button>
    <select id="inputs" aria-label="MIDI input" disabled><option>No keyboard connected</option></select>
    <label class="toggle"><input type="checkbox" id="sound" checked> Play sound here</label>
    <div class="status"><span class="dot" id="dot"></span><span id="state">Not connected</span></div>
  </div>
  <p id="msg" role="status"></p>

  <div class="readout">
    <div class="stat"><b id="note">–</b><span>Last note</span></div>
    <div class="stat"><b id="vel">–</b><span>Velocity (0–127)</span></div>
    <div class="stat"><b id="held">0</b><span>Keys held</span></div>
    <div class="stat"><b id="pedal">Up</b><span>Sustain pedal</span></div>
  </div>

  <div class="scroller" id="scroller"><div class="keys" id="keys"></div></div>

  <h2>Key log</h2>
  <ul id="log"><li class="empty">Played keys will appear here.</li></ul>
</main>

<script>
(function(){
  var NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var LOW=21, HIGH=108, WW=38, BW=24;
  var keysEl=document.getElementById("keys"), scroller=document.getElementById("scroller");
  var elByNote={}, held={}, access=null, currentInput=null, audio=null, voices={};

  function isBlack(n){return [1,3,6,8,10].indexOf(n%12)>-1}
  function nameOf(n){return NAMES[n%12]+(Math.floor(n/12)-1)}
  function freq(n){return 440*Math.pow(2,(n-69)/12)}

  // build keyboard
  var whiteIndex=0;
  for(var n=LOW;n<=HIGH;n++){
    var el=document.createElement("div");
    if(!isBlack(n)){
      el.className="key w"; el.style.left=(whiteIndex*WW)+"px"; el.style.width=WW+"px";
      if(n%12===0){var s=document.createElement("span");s.className="n";s.textContent=nameOf(n);el.appendChild(s)}
      whiteIndex++;
    }else{
      el.className="key b"; el.style.left=(whiteIndex*WW-BW/2)+"px"; el.style.width=BW+"px";
    }
    el.dataset.note=n; elByNote[n]=el; keysEl.appendChild(el);
  }
  keysEl.style.width=(whiteIndex*WW)+"px";

  // sound
  function ensureAudio(){
    if(!audio){var C=window.AudioContext||window.webkitAudioContext; if(C) audio=new C()}
    if(audio&&audio.state==="suspended") audio.resume();
  }
  function startTone(n,v){
    if(!document.getElementById("sound").checked) return;
    ensureAudio(); if(!audio) return; stopTone(n,true);
    var o=audio.createOscillator(), o2=audio.createOscillator(), g=audio.createGain(), now=audio.currentTime;
    o.type="triangle"; o2.type="sine"; o.frequency.value=freq(n); o2.frequency.value=freq(n)*2;
    var peak=0.08+0.22*(v/127);
    g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(peak,now+0.01);
    g.gain.exponentialRampToValueAtTime(peak*0.4,now+0.6);
    o.connect(g); o2.connect(g); g.connect(audio.destination); o.start(); o2.start();
    voices[n]={o:o,o2:o2,g:g};
  }
  function stopTone(n,quick){
    var x=voices[n]; if(!x||!audio) return; var now=audio.currentTime, r=quick?0.02:0.25;
    x.g.gain.cancelScheduledValues(now); x.g.gain.setValueAtTime(x.g.gain.value,now);
    x.g.gain.exponentialRampToValueAtTime(0.0001,now+r);
    x.o.stop(now+r+0.02); x.o2.stop(now+r+0.02); delete voices[n];
  }

  // UI updates
  function count(){return Object.keys(held).length}
  function logEvent(txt,vel){
    var log=document.getElementById("log"), e=log.querySelector(".empty"); if(e) e.remove();
    var li=document.createElement("li"), t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
    li.innerHTML='<span class="t">'+t+'</span><span>'+txt+'</span><span>'+(vel!=null?"velocity "+vel:"")+'</span>';
    log.insertBefore(li,log.firstChild); while(log.children.length>60) log.lastChild.remove();
  }
  function noteOn(n,v,fromKeyboard){
    if(!elByNote[n]) return;
    held[n]=true; elByNote[n].classList.add("on");
    document.getElementById("note").textContent=nameOf(n);
    document.getElementById("vel").textContent=v;
    document.getElementById("held").textContent=count();
    logEvent("Pressed "+nameOf(n)+" (MIDI "+n+")",v);
    startTone(n,v);
    if(fromKeyboard){
      var x=elByNote[n].offsetLeft, view=scroller.clientWidth, sl=scroller.scrollLeft;
      if(x<sl+30||x>sl+view-60) scroller.scrollTo({left:Math.max(0,x-view/2),behavior:"smooth"});
    }
  }
  function noteOff(n){
    if(!elByNote[n]) return;
    delete held[n]; elByNote[n].classList.remove("on");
    document.getElementById("held").textContent=count();
    stopTone(n);
  }

  // MIDI messages
  function onMessage(ev){
    var d=ev.data; if(!d||d.length<1) return;
    var cmd=d[0]&0xf0, a=d[1], b=d[2];
    if(cmd===0x90&&b>0) noteOn(a,b,true);
    else if(cmd===0x80||(cmd===0x90&&b===0)) noteOff(a);
    else if(cmd===0xb0&&a===64){
      var down=b>=64; document.getElementById("pedal").textContent=down?"Down":"Up";
      logEvent("Sustain pedal "+(down?"down":"up"));
    }
  }

  function setState(on,text){
    document.getElementById("dot").className="dot"+(on?" on":"");
    document.getElementById("state").textContent=text;
  }
  function say(t,err){var m=document.getElementById("msg"); m.textContent=t; m.className=err?"err":""}

  function bindInput(input){
    if(currentInput) currentInput.onmidimessage=null;
    currentInput=input;
    if(input){
      input.onmidimessage=onMessage;
      setState(true,"Connected: "+(input.name||"MIDI device"));
      say("Ready. Press a key on your keyboard.");
    }else{
      setState(false,"Not connected");
      say("No keyboard found. Turn it on, pair it over Bluetooth, then press Connect keyboard again.",true);
    }
  }

  function refreshInputs(){
    var sel=document.getElementById("inputs"), list=[];
    access.inputs.forEach(function(i){list.push(i)});
    sel.innerHTML="";
    if(!list.length){
      sel.disabled=true; var o=document.createElement("option"); o.textContent="No keyboard found"; sel.appendChild(o);
      bindInput(null); return;
    }
    sel.disabled=false;
    list.forEach(function(i){var o=document.createElement("option");o.value=i.id;o.textContent=i.name||i.id;sel.appendChild(o)});
    var keep=currentInput&&list.filter(function(i){return i.id===currentInput.id})[0];
    var pick=keep||list.filter(function(i){return /artplay|p1/i.test(i.name||"")})[0]||list[0];
    sel.value=pick.id; bindInput(pick);
  }

  document.getElementById("inputs").addEventListener("change",function(e){
    var found=null; access.inputs.forEach(function(i){if(i.id===e.target.value) found=i}); if(found) bindInput(found);
  });

  document.getElementById("connect").addEventListener("click",function(){
    ensureAudio();
    if(!navigator.requestMIDIAccess){
      say("This browser can’t use Bluetooth MIDI. Open this page in Chrome or Edge on Android or a computer. iPhone and iPad browsers don’t support it.",true);
      return;
    }
    say("Asking for permission…");
    navigator.requestMIDIAccess({sysex:false}).then(function(a){
      access=a; a.onstatechange=refreshInputs; refreshInputs();
    }).catch(function(err){
      say("Couldn’t open MIDI ("+(err&&err.name?err.name:"error")+"). Allow the MIDI permission when asked. If it still fails, open the page directly in Chrome or Edge instead of inside another app.",true);
    });
  });

  // play with mouse / touch
  var down={};
  keysEl.addEventListener("pointerdown",function(e){
    var k=e.target.closest(".key"); if(!k) return; var n=+k.dataset.note; ensureAudio();
    down[e.pointerId]=n; noteOn(n,90,false); e.preventDefault();
  });
  function up(e){var n=down[e.pointerId]; if(n!=null){noteOff(n); delete down[e.pointerId]}}
  window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);

  // start view around middle C
  scroller.scrollLeft=elByNote[60].offsetLeft-scroller.clientWidth/2;
})();
</script>
</body>
</html>
